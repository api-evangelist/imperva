  /api/prov/v1/sites/performance/advanced:
    post:
      tags:
      - Site Management
      summary: Advanced Caching Settings
      description: Use this operation to modify advanced caching settings.
      operationId: modifyAdvancedCachingSettings
      parameters:
      - name: site_id
        in: query
        description: Numeric identifier of the site to operate on.
        required: true
        schema:
          type: string
        example: 10
      - name: param
        in: query
        description: 'Name of configuration parameter to set.<br/>Possible values for param and value parameters:<br/><ul><li><b>async_validation</b> Sets Async validation. Pass "true" or "false" in the value parameter.</li><li><b>minify_javascript</b> Sets the Minify JS. Pass "true" or "false" in the value parameter.</li><li><b>minify_css</b> Sets the Minify CSS. Pass "true" or "false" in the value parameter</li><li><b>minify_static_html</b> Sets Minify static HTML. Pass "true" or "false" in the value parameter</li><li><b>compress_jpeg</b> Sets the Compress JPEG. Pass "true" or "false" in the value parameter.</li><li><b>progressive_image_rendering</b> Sets the Progressive Image rendering flag. Pass "true" or "false" in the value parameter.</li><li><b>aggressive_compression</b> Sets the Aggressive compression rendering flag. Pass "true" or "false" in the value parameter.</li><li><b>compress_png</b> Sets the Compress PNG flag. Pass "true" or "false" in the value parameter.</li><li><b>on_the_fly_compression</b> "On the fly" Compression. Pass "true" or "false" in the value parameter.</li><li><b>tcp_pre_pooling</b> TCP Pre-Pooling. Pass "true" or "false" in the value parameter.</li><li><b>comply_no_cache</b> Comply with no-cache and max-age directives in client requests. Pass "true" or "false" in the value parameter.</li><li><b>comply_vary</b> Comply with the <b>Vary</b> header. Pass "true" or "false" in the value parameter.</li><li><b>use_shortest_caching</b> Use shortest caching duration in case of conflicts. Pass "true" or "false" in the value parameter.</li><li><b>prefer_last_modified</b> Prefer ''last modified'' over eTag. Pass "true" or "false" in the value parameter.</li><li><b>disable_client_side_caching</b> Disable client side caching. Pass "true" or "false" in the value parameter.</li><li><b>cache_300x</b> Cache 300X responses. Pass "true" or "false" in the value parameter.</li><li><b>unite_naked_full_cache</b> Use the same cache for full and naked domains. For example, use the same cached resource for <a href="https://www.example.com/a"></a> and <a href="https://example.com/"></a>a.</li><li><b>cache_empty_responses</b> Cache responses that don’t have a message body.</li><li><b>cache_http_10_responses</b> Cache HTTP 1.0 type responses that don’t include the Content-Length header or chunking. Pass "true" or "false" in the value parameter.</li><li><b>send_age_header</b> Send <b>Cache-Control: max-age</b> and <b>Age</b> headers. Pass "true" or "false" in the value parameter.</li><li><b>support_non_sni_clients</b> By default, non-SNI clients are supported. Disable this option to block non-SNI clients. Pass "true" or "false" in the value parameter.</li><li><b>origin_connection_reuse</b> By default, TCP connections that are opened for a client request remain open for a short time to handle additional requests that may arrive. This option disables that behavior.. Pass "true" or "false" in the value parameter.</li><li><b>redirect_http_to_https</b> Redirect HTTP requests to HTTPS requests by sending an HTTP 301 response.</li><li><b>redirect_naked_domain_to_full</b> Redirect requests from your website''s naked domain to its full domain by sending and HTTP 301 response.</li><li><b>http_2</b> Enables supporting browsers to take advantage of the performance enhancements provided by HTTP/2 for your website. Non-supporting browsers can connect via HTTP/1.0 or HTTP/1.1. HTTP/2 support requires that SSL is configured for your website. Pass "true" or "false" in the value parameter</li></ul>'
        required: true
        schema:
          type: string
        example: async_validation
      - name: value
        in: query
        description: According to the param value.
        required: true
        schema:
          type: string
        example: true
      responses:
        '200':
          description: res - contains the specific error code:<br/>2 - Invalid input<br/>9413 - Unknown/unauthorized site_id<br/>5 - Operation unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
