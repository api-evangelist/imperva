        required: true
        schema:
          type: string
        example: 15
      - name: rule_id
        in: query
        description: The id of the rule (either a security or an acl rule), e.g api.threats.sql_injection, api.threats.cross_site_scripting, api.threats.illegal_resource_access
        required: true
        schema:
          type: string
        example: 548723
      - name: allowlist_id
        in: query
        description: The id (an integer) of the allow list to be set. This field is optional - in case no id is supplied, a new allow list will be created.
        required: true
        schema:
          type: string
        example: 433245
      - name: delete_allowlist
        in: query
        description: An optional boolean parameter. If it is set to "true" and a allow list id is sent, the allow list will be deleted.
        schema:
          type: string
        example: false
      - name: urls
        in: query
        description: A comma separated list of resource paths.</br>For example, /home and /admin/index.html are resource paths, while <a href="http://www.example.com/home">http://www.example.com/home</a> is not.</br>Each URL should be encoded separately using percent encoding as specified by RFC 3986 (<a href="http://tools.ietf.org/html/rfc3986#section-2.1">http://tools.ietf.org/html/rfc3986#section-2.1</a>).<br/>An empty URL list will remove all URLs.
        schema:
          type: string
        example: /home
      - name: countries
        in: query
        description: A comma separated list of country codes.
        schema:
          type: string
        example: US
      - name: continents
        in: query
        description: A comma separated list of continent codes.
        schema:
          type: string
        example: SA
      - name: ips
        in: query
        description: 'A comma separated list of IPs or IP ranges, e.g: 192.168.1.1, 192.168.1.1-192.168.1.100 or 192.168.1.1/24'
        schema:
          type: string
        example: 192.168.1.1/24
      - name: client_app_types
        in: query
        description: A comma separated list of client application types
        schema:
          type: string
        example: Browser
      - name: client_apps
        in: query
        description: A comma separated list of client application IDs.
        schema:
          type: string
        example: 3
      - name: parameters
        in: query
        description: A comma separated list of encoded parameters.
        schema:
          type: string
      - name: user_agents
        in: query
        description: A comma separated list of encoded user agents.
        schema:
          type: string
        example: Googlebot-2.1
      - name: exception_id_only
        in: query
        description: Return only the new/edited exception id.
        schema:
          type: string
        example: true
      responses:
        '200':
          description: res - contains the specific error code:<br/>2 - Invalid input.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiResultSiteStatus'
                - $ref: '#/components/schemas/ApiResult'
  /api/prov/v1/sites/configure/security:
    post:
      tags:
      - Site Management
      summary: Modify Site Security Configuration
      description: Use this operation to change the security configuration of a site. To modify the configuration for a specific rule, additional parameters may be required, as documented below.
      operationId: modifySiteSecurityConfiguration
      parameters:
      - name: site_id
        in: query
        description: Numeric identifier of the site to operate on
        required: true
        schema:
          type: string
        example: 15
      - name: rule_id
        in: query
        description: ID of the security rule to change.<br/>Values for the rule_id parameter:<br/><ul><li>api.threats.bot_access_control</li><li>api.threats.sql_injection</li><li>api.threats.cross_site_scripting</li><li>api.threats.backdoor</li><li>api.threats.ddos</li><li>api.threats.remote_file_inclusion</li></ul>
        required: true
        schema:
          type: string
        example: 578942
      - name: block_bad_bots
        in: query
        description: 'Whether or not to block bad bots. Possible values: true, false'
        schema:
          type: string
        example: true
      - name: challenge_suspected_bots
        in: query
        description: 'Whether or not to send a challenge to clients that are suspected to be bad bots (CAPTCHA for example). Possible values: true, false'
        schema:
          type: string
        example: true
      - name: activation_mode
        in: query
        description: 'Possible values: off, auto, on<br/><ul><li><b>off</b> security measures are disabled even if site is under a DDoS attack</li><li><b>auto</b> security measures will be activated automatically when the system suspects site is under a DDoS attack</li><li><b>on</b> security measures are enabled even if site is not under a DDoS attack</li></ul>The syntax is as follows:<rule_id>.activation_mode.<value> For example, for ''off'', use ''activation_mode=api.threats.ddos.activation_mode.off.<br/><b>Note:</b> This parameter is relevant and required for a DDoS rule only -- where rule_id=api.threats.ddos.'
        schema:
          type: string
        example: 'off'
      - name: security_rule_action
        in: query
        description: The action that should be taken when a threat is detected, for example:<br/>api.threats.action.block_ip. Different actions are allowed per different threats, e.g. backdoors may only be quarantined, ignored, or trigger an alert.<br/>Values for the security_rule_action parameter:<br/><ul><li><b>api.threats.action.disabled</b> Threat is not blocked, site owner is not notified.</li><li><b>api.threats.action.alert</b> Threat is not blocked, site owner is notified.</li><li><b>api.threats.action.block_request</b> Threat blocked by stopping the request, site owner is notified.</li><li><b>api.threats.action.block_user</b> Threat blocked by stopping the request. Additional requests by the client application will be automatically blocked for a duration of several minutes. Site owner is notified.</li><li><b>api.threats.action.block_ip</b> Threat blocked by stopping the request. Additional requests from the same IP addresses will be automatically blocked for a duration of several minutes. Site owner is notified.</li><li><b>api.threats.action.quarantine_url</b> Relevant only for Backdoor Protect. When detecting a backdoor, additional requests to the URL of the backdoor will be automatically blocked. Site owner is notified.</li></ul>
        schema:
          type: string
        example: api.threats.action.alert
      - name: quarantined_urls
        in: query
        description: 'Removes quarantined URLs from the backdoor protection list, as defined in the Cloud Security Console Website Settings > WAF Settings > Backdoor Protect.<br/>To remove a URL from the backdoor protection list, use the following parameters with the specified values:<br/>quarantined_urls: <URL full path><br/>rule_id: api.threats.backdoor<br/>security_rule_action: api.threats.action.quarantine_url'
        schema:
          type: string
        example: www.example.com
      - name: ddos_traffic_threshold
        in: query
        description: Consider site to be under DDoS if the request rate is above this threshold.<br/>The valid values are 10, 20, 50, 100, 200, 500, 750, 1000, 2000, 3000, 4000, 5000
        schema:
          type: integer
          format: int64
        example: 1500
      responses:
        '200':
          description: res - contains the specific error code:<br/>9414 - Feature not permitted<br/>9415 - Operation not allowed<br/>2 - Invalid input
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiResultSiteStatus'
                - $ref: '#/components/schemas/ApiResult'
  /api/prov/v1/sites/report:
    post:
      tags:
      - Site Management
      summary: Get Site Report
      description: Use this operation to get a report for a site. Reports are sent using Base64 encoding.
      operationId: getSiteReport
      parameters:
      - name: site_id
        in: query
        description: Numeric identifier of the site to operate on
        required: true
        schema:
          type: string
        example: 10
      - name: report
        in: query
        description: 'The report to get. One of: pci-compliance'
        required: true
        schema:
          type: string
        example: pci-compliance
      - name: format
        in: query
        description: 'The format to get the report in. One of: pdf | html'
        required: true
        schema:
          type: string
        example: pdf
      - name: time_range
        in: query
        description: 'Time range to fetch data for.<br/>Some operations require the user to specify a time range. This is done via the time_range parameter, which accepts the following values:<br/><ul><li><b>today</b> Retrieve data from midnight today until the current time.</li><li><b>last_7_days</b> Retrieve data from midnight of 7 days ago until the current time.</li><li><b>last_30_days</b> Retrieve data from midnight of 30 days ago until the current time.</li><li><b>last_90_days</b> Retrieve data from midnight of 90 days ago until the current time.</li><li><b>month_to_date</b> Retrieve data from midnight of the first day of the month until the current time.</li><li><b>custom</b> Specify a custom time range using two additional parameters: start and end.<br/>Results are provided for full days only, starting from midnight. A time range of less than 24 hours gives results for the full day.<br/>For example:<ul><li>A time range of 14:00 - 20:00 yesterday gives results for all of yesterday (midnight to midnight) - a full day.</li><li>A time range of 14:00 last Tuesday to 14:00 last Wednesday gives results for all of Tuesday and Wednesday - two full days.</li> <li>A time range of 14:00 yesterday to 14:00 today gives results for all of yesterday starting from midnight until the current time today.</li></ul></li></ul>'
        required: true
        schema:
          type: string
        example: last_7_days
      - name: start
        in: query
        description: 'Start date in milliseconds since 1970.<br/>Some operations require the user to specify a time range. This is done via the time_range parameter, which accepts the following values:<br/><ul><li><b>today</b> Retrieve data from midnight today until the current time.</li><li><b>last_7_days</b> Retrieve data from midnight of 7 days ago until the current time.</li><li><b>last_30_days</b> Retrieve data from midnight of 30 days ago until the current time.</li><li><b>last_90_days</b> Retrieve data from midnight of 90 days ago until the current time.</li><li><b>month_to_date</b> Retrieve data from midnight of the first day of the month until the current time.</li><li><b>custom</b> Specify a custom time range using two additional parameters: start and end.<br/>Results are provided for full days only, starting from midnight. A time range of less than 24 hours gives results for the full day.<br/>For example:<ul><li>A time range of 14:00 - 20:00 yesterday gives results for all of yesterday (midnight to midnight) - a full day.</li><li>A time range of 14:00 last Tuesday to 14:00 last Wednesday gives results for all of Tuesday and Wednesday - two full days.</li> <li>A time range of 14:00 yesterday to 14:00 today gives results for all of yesterday starting from midnight until the current time today.</li></ul></li></ul>'
        schema:
          type: string
        example: 1610356734
      - name: end
        in: query
        description: 'End date in milliseconds since 1970.<br/>Some operations require the user to specify a time range. This is done via the time_range parameter, which accepts the following values:<br/><ul><li><b>today</b> Retrieve data from midnight today until the current time.</li><li><b>last_7_days</b> Retrieve data from midnight of 7 days ago until the current time.</li><li><b>last_30_days</b> Retrieve data from midnight of 30 days ago until the current time.</li><li><b>last_90_days</b> Retrieve data from midnight of 90 days ago until the current time.</li><li><b>month_to_date</b> Retrieve data from midnight of the first day of the month until the current time.</li><li><b>custom</b> Specify a custom time range using two additional parameters: start and end.<br/>Results are provided for full days only, starting from midnight. A time range of less than 24 hours gives results for the full day.<br/>For example:<ul><li>A time range of 14:00 - 20:00 yesterday gives results for all of yesterday (midnight to midnight) - a full day.</li><li>A time range of 14:00 last Tuesday to 14:00 last Wednesday gives results for all of Tuesday and Wednesday - two full days.</li> <li>A time range of 14:00 yesterday to 14:00 today gives results for all of yesterday starting from midnight until the current time today.</li></ul></li></ul>'
        schema:
          type: string
        example: 1610356734
      responses:
        '200':
          description: res - contains the specific error code:<br/>5001 - Report invalid<br/>5002 - Format invalid
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiResultReport'
                - $ref: '#/components/schemas/ApiResult'
