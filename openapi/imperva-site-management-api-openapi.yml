  /api/prov/v1/sites/configure:
    post:
      tags:
      - Site Management
      summary: Modify Site Configuration
      description: Use this operation to change one of the basic configuration settings of the site.
      operationId: modifySiteConfiguration
      parameters:
      - name: site_id
        in: query
        description: Numeric identifier of the site to operate on
        required: true
        schema:
          type: string
        example: example.imperva.com
      - name: param
        in: query
        description: 'Name of configuration parameter to set.<br/>Parameter values:<br/><ul><li><b>active</b> Whether the site is active or bypassed by the Imperva network. One of: active | bypass.</li><li><b>site_ip</b> Comma separated list of IPs. For example: 8.8.8.8,1.2.2.2</li><li><b>domain_validation</b> Sets the domain validation method that will be used to generate an SSL certificate. One of: email | html | dns<br/><b>Note</b>: When running domain validation on a site, you may see the following error message in the API response: Internal error - "Add site operation hasn''t finished".<br/>After running the add site process, it may take several minutes for the database to finish updating. During this time, attempts to further configure the site are blocked.<br/>In some cases, the database is not updated even after the add site process is complete.<br/>If the issue does not resolve after a few minutes, contact Support.</li><li><b>approver</b> Sets the approver e-mail address that will be used to perform SSL domain validation.</li><li><b>ignore_ssl</b> Sets the ignore SSL flag (if the site is in pending-select-approver state). Pass "true" in the value parameter.</li><li><b>acceleration_level</b> Sets the acceleration level of the site, one of: none | standard | aggressive. It is advised to use the newer Modify caching mode API call instead, as it provides enhanced functionality.</li><li><b>seal_location</b> Sets the seal location, e.g. "api.seal_location.bottom_right".</li><li><b>domain_redirect_to_full</b> Sets the redirect naked to full flag. Pass "true" in the value parameter.</li><li><b>remove_ssl</b> Sets the remove SSL from site flag. Pass "true" in the value parameter.</li><li><b>ref_id</b> Sets the Reference ID, a free-text field that enables you to add a unique identifier to correlate an object in our service, such as a protected website, with an object on the customer side.</li></ul>'
        required: true
        schema:
          type: string
        example: active
      - name: value
        in: query
        description: According to the param value.
        required: true
        schema:
          type: string
        example: bypass
      responses:
        '200':
          description: res - contains the specific error code:<br/>3015 - Internal error<br/>6001 - Invalid configuration parameter name<br/>6002 - Invalid configuration parameter value<br/>1 - Unexpected error<br/>9414 - Feature not permitted
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiResultSiteStatus'
                - $ref: '#/components/schemas/ApiResult'
