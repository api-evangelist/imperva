openapi: 3.2.0
info:
  version: 13.1.0.0
  title: MX Open Auth API
servers:
- url: https://127.0.0.1:8083/SecureSphere/api
tags:
- name: Auth
paths:
  /v1/auth/session/roles:
    get:
      operationId: getRole
      summary: Get role
      description: ''
      tags:
      - Auth
      security:
      - basicAuth: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
      x-summary-source: derived
  /v1/auth/session:
    post:
      operationId: getSessionId
      summary: Get session id
      description: ''
      tags:
      - Auth
      security:
      - basicAuth: []
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        description: ''
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/definitions/SessionIdDTO'
      x-summary-source: derived
    delete:
      operationId: logout
      summary: Logout
      description: ''
      tags:
      - Auth
      security:
      - basicAuth: []
      responses:
        default:
          description: successful operation
      x-summary-source: derived
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
